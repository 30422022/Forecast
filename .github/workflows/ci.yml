name: public-preview-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gridcast_test
          POSTGRES_DB: gridcast_test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gridcast_test -d gridcast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GRIDCAST_TEST_DATABASE_URL: postgresql://gridcast_test@127.0.0.1:5432/gridcast_test
      PGPASSWORD: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python scripts/release_guard.py
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
